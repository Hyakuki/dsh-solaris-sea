<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>索拉里斯之海</title>
<style>
  :root{
    --ink:#e8f0ff;
    --dim:#8fa3c4;
    --line:rgba(150,190,255,.14);
    --glass:rgba(8,14,28,.78);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#01030a;overflow:hidden}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #sea.dragging{cursor:grabbing}

  /* ——— 左上：标题与统计 ——— */
  #hud{position:fixed;left:26px;top:22px;pointer-events:none;user-select:none}
  #hud h1{
    margin:0;font-size:15px;font-weight:500;letter-spacing:.34em;
    color:#dbe9ff;text-shadow:0 0 18px rgba(120,180,255,.55);
  }
  #hud .stat{margin-top:8px;font-size:11.5px;color:var(--dim);letter-spacing:.12em}
  #hud .stat b{color:#bcd4ff;font-weight:500}

  /* ——— 左上：时间窗（拖到哪几天，就只亮那几天的星） ———
     放在标题下面，是因为他把「左侧除了左上角的信息不动」说成了条件：
     新的东西只许长在这里，别再往左边长第二条栏。 */
  #tf{margin-top:12px;width:214px;pointer-events:auto;user-select:none}
  #tf .lab{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;letter-spacing:.16em;color:#7f95b8;
  }
  #tf .lab b{font-weight:500;letter-spacing:.06em;color:#c3d7f5;font-variant-numeric:tabular-nums}
  #tf input[type=range]{
    -webkit-appearance:none;appearance:none;display:block;width:100%;height:13px;
    background:transparent;cursor:pointer;margin:1px 0 0;
  }
  #tf input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:rgba(150,190,255,.2)}
  #tf input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;margin-top:-3.5px;border-radius:50%;
    background:#d3e2ff;box-shadow:0 0 9px rgba(140,190,255,.85);border:0;
  }
  #tf input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(150,190,255,.2)}
  #tf input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#d3e2ff}
  #tf .all{display:inline-block;margin-top:3px;font-size:10.5px;letter-spacing:.1em;color:#61769a;cursor:pointer}
  #tf .all:hover{color:#bcd4ff}

  /* ——— 左下：旋臂图例（可点） ———
     横排、自动换行：旋臂以后只会更多，竖排一多就顶出屏幕、点不到。
     宽度封在 54vw，免得压到右下的操作提示。 */
  #legend{
    position:fixed;left:26px;bottom:22px;max-width:54vw;
    display:flex;flex-wrap:wrap;gap:3px 15px;
    font-size:11px;color:var(--dim);user-select:none;
  }
  #legend .row{
    display:flex;align-items:center;gap:6px;cursor:pointer;padding:1px 4px;border-radius:4px;
    white-space:nowrap;transition:color .15s,background .15s;
  }
  #legend .row:hover{color:#eaf2ff;background:rgba(120,170,255,.07)}
  #legend .row.on{color:#fff;background:rgba(120,170,255,.12)}
  #legend .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  #legend .n{margin-left:2px;color:#6f83a3;font-size:10.5px}

  /* ——— 右下：操作提示 ——— */
  #hint{
    position:fixed;right:26px;bottom:22px;font-size:11px;color:#5f7393;
    letter-spacing:.08em;user-select:none;text-align:right;line-height:1.7;
  }

  /* ——— 右侧：点开一颗星 ——— */
  #panel{
    position:fixed;right:22px;top:22px;bottom:22px;width:352px;max-width:calc(100vw - 44px);
    background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid rgba(140,180,255,.16);border-radius:14px;
    padding:20px 20px 18px;overflow:auto;
    box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 0 60px rgba(60,110,200,.06);
    transform:translateX(calc(100% + 40px));opacity:0;
    transition:transform .28s cubic-bezier(.22,.8,.3,1),opacity .2s;
  }
  #panel.open{transform:none;opacity:1}
  #panel .close{
    position:absolute;right:14px;top:12px;width:26px;height:26px;border:0;border-radius:50%;
    background:rgba(255,255,255,.06);color:#9db2d4;font-size:15px;line-height:1;cursor:pointer;
  }
  #panel .close:hover{background:rgba(255,255,255,.12);color:#fff}
  #panel .arm{font-size:11px;letter-spacing:.18em;color:#7f95b8}
  #panel .head{margin:10px 0 14px;font-size:16px;line-height:1.72;color:#eef4ff;font-weight:400}
  #panel .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:#8fa3c4;margin-bottom:14px}
  #panel .kw{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 16px}
  #panel .kw span{
    font-size:11px;padding:3px 9px;border-radius:999px;
    background:rgba(120,170,255,.10);border:1px solid rgba(140,180,255,.16);color:#b9cdee;
  }
  #panel .sec{font-size:10.5px;letter-spacing:.22em;color:#5f7393;margin:20px 0 8px}
  #panel .ptr{
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#7d92b3;
    word-break:break-all;line-height:1.7;
  }
  #panel .rel{display:flex;flex-direction:column;gap:2px}
  #panel .rel button{
    all:unset;cursor:pointer;padding:7px 8px;border-radius:6px;font-size:12px;line-height:1.55;
    color:#c6d7f2;transition:background .12s;
  }
  #panel .rel button:hover{background:rgba(120,170,255,.10);color:#fff}
  #panel .rel button .t{color:#6a7f9f;font-size:10.5px;margin-right:7px}
  #panel .rel button .v{color:#7f95b8;font-size:10.5px;margin-left:6px}

  #tip{
    position:fixed;padding:5px 9px;border-radius:6px;font-size:11.5px;
    background:rgba(8,14,28,.9);border:1px solid rgba(140,180,255,.18);color:#dbe9ff;
    pointer-events:none;opacity:0;transition:opacity .12s;max-width:280px;line-height:1.5;
  }
  @media (max-width:760px){
    #panel{width:calc(100vw - 24px);right:12px;top:auto;height:52vh;bottom:12px}
    #legend{display:none}
    #hint{font-size:10px;right:14px;bottom:14px}
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>

<div id="hud">
  <h1>索拉里斯之海</h1>
  <div class="stat" id="stat"></div>
  <div id="tf">
    <div class="lab"><span>时间窗</span><b id="tfOut">全部</b></div>
    <input id="tfA" type="range" aria-label="从" />
    <input id="tfB" type="range" aria-label="到" />
    <span class="all" id="tfAll">全部时间</span>
  </div>
</div>

<div id="legend"></div>

<div id="hint">
  拖拽 · 转<br />滚轮 · 远近<br />双击 · 回正<br />空格 · 停<br />点星 · 看记忆
</div>

<aside id="panel">
  <button class="close" id="close" title="收起">×</button>
  <div class="arm" id="p-arm"></div>
  <div class="head" id="p-head"></div>
  <div class="meta" id="p-meta"></div>
  <div class="kw" id="p-kw"></div>
  <div class="sec">指&nbsp;&nbsp;针</div>
  <div class="ptr" id="p-ptr"></div>
  <div class="sec">连&nbsp;着</div>
  <div class="rel" id="p-rel"></div>
</aside>

<div id="tip"></div>

<script>
/* ============================================================
   索拉里斯之海 · 记忆星图
   形状定死（改这里之前想清楚）：
     · 一片海，不是一张表
     · 旋臂   = 记忆的分类（人写的关键词，不是机器切的碎词）
     · 半径   = 权重与新鲜度（化石态会随年龄慢慢变暗、往外漂）
     · 亮度   = 有效重量（含衰减）
     · 中心   = 自我核心（黑洞，所有记忆绕着它转）
     · 差速自转：靠内转得快，靠外转得慢
     · 点开一颗星 = 一段记忆的一句话 + 原话指针 + 连着的记忆
   数据由 bin/graph.mjs 内联写进来，file:// 双击就能看，不联网。
   ============================================================ */
const DATA = /*__DATA__*/ { nodes: [], edges: [], arms: [], stats: {} };

const ARM_COLORS = ['#8fc7ff','#9fe6c8','#ffd9a0','#c8b3ff','#ffabcb','#a8f0a0','#ffc08a','#93bfd8'];
const ARM_NAMES  = DATA.arms.slice();
const ARM_INDEX  = new Map(ARM_NAMES.map((n, i) => [n, i]));
const colorIdxOf = (arm) => { const i = ARM_INDEX.get(arm); return i == null ? 7 : i; };

const cv  = document.getElementById('sea');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

/* ——— 视图状态 ——— */
const view = { yaw: 0, pitch: 0.62, zoom: 1, paused: false };
const HOME = { yaw: 0, pitch: 0.62, zoom: 1 };
let t0 = performance.now();
let clock = 0;            // 累计模拟时间（秒），暂停时不增长
let focusArm = null;      // 高亮某条旋臂
let selected = null;      // 选中的节点 id
let hover = null;

/* ——— 时间窗 ———
   他想「按时间回看」：拖到哪几天，就只亮那几天的星。
   星尘没有日期（它只是海面上的碎光），所以时间窗只调暗它，不删它；
   有日期的星星才真的亮/暗。 */
const DAY_MS = 86400000;
const DAY_MIN = Math.floor(Math.min(...DATA.nodes.map((n) => n.startTs || 0)) / DAY_MS);
const DAY_MAX = Math.floor(Math.max(...DATA.nodes.map((n) => n.startTs || 0)) / DAY_MS);
const win = { from: DAY_MIN, to: DAY_MAX };
const dayOf = (ts) => Math.floor((ts || 0) / DAY_MS);
const inWindow = (ts) => { const d = dayOf(ts); return d >= win.from && d <= win.to; };
const windowOn = () => win.from > DAY_MIN || win.to < DAY_MAX;
let winDim = 1;           // 时间窗开着时，星尘和云整体压暗一点（每帧算一次）

/* ——— 数值工具 ——— */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hash01 = (n) => { let x = (n * 2654435761) >>> 0; x ^= x >>> 13; x = (x * 1274126177) >>> 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };
const rgb = (hex) => { const v = parseInt(hex.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; };
const rgba = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };

/* ============================================================
   ① 布局：把「权重」变成半径，把「分类」变成角度
   对数螺旋：θ = 臂起始角 + 扭转系数·r —— 越往外，臂就弯得越多
   ============================================================ */
const armTotal = Math.max(1, ARM_NAMES.length);
const effMax = Math.max(1e-6, ...DATA.nodes.map((n) => n.effective || 0));

for (const n of DATA.nodes) {
  const e = Math.max(0.02, n.effective || 0);
  n.r = 0.16 + 0.84 * Math.pow(e / effMax, 0.72);
  n.a0 = (colorIdxOf(n.arm) / armTotal) * Math.PI * 2 + n.r * 2.05 + (hash01(n.id) - 0.5) * 0.24;
  n.y0 = (hash01(n.id * 7 + 3) - 0.5) * 0.16;
  n.bright = clamp(0.28 + 0.72 * Math.pow(e / effMax, 0.8), 0.2, 1);
  n.size = 0.55 + 0.45 * Math.pow(e / effMax, 0.6);
}
const maxWeight = Math.max(1e-6, ...DATA.nodes.map((n) => n.weight || 0));
const nodeById = new Map(DATA.nodes.map((n) => [n.id, n]));

/* ============================================================
   ② 星尘：不是画在页面上的装饰，是「很多还记不清的碎光」
   —— 沿旋臂撒，靠内的密、靠外的散；差速自转由角度决定
   ============================================================ */
let seed = 20261107;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 1.1;

const DUST = Math.round(clamp((window.innerWidth * window.innerHeight) / 130, 4000, 14000));
const dust = [];
for (let i = 0; i < DUST; i += 1) {
  const field = rnd() < 0.15;                       // 15% 是背景海面上的散光
  const ci = field ? 7 : Math.floor(rnd() * armTotal);
  const r = field ? Math.pow(rnd(), 0.7) * 1.05 : Math.pow(rnd(), 0.5) * 1.02;
  const th = field
    ? rnd() * Math.PI * 2
    : (ci / armTotal) * Math.PI * 2 + r * 2.05 + gauss() * (0.09 + r * 0.2);
  const alpha = field ? 0.08 + rnd() * 0.16 : 0.16 + Math.pow(rnd(), 1.6) * 0.55;
  dust.push({
    r, th, ci,
    bucket: alpha < 0.22 ? 0 : alpha < 0.36 ? 1 : alpha < 0.55 ? 2 : 3,
    size: rnd() < 0.88 ? 1 : 2,
    y: gauss() * 0.02,
  });
}
// 先按「颜色 + 亮度档」排好，画的时候只在换档时改一次 fillStyle（六千颗也不卡）
dust.sort((a, b) => a.ci - b.ci || a.bucket - b.bucket);
const DUST_BUCKET_A = [0.13, 0.26, 0.48, 0.78];

/* 发光贴图：每帧给 80 颗星各建一次径向渐变太贵，先烘成小图再用 */
/* 逐像素烘图：canvas 的渐变只有 8 位精度，放大以后会出一圈圈的色阶断层。
   所以自己算每个像素的 alpha，再抖一点随机噪声——放大了也是雾，不是靶子。 */
function spritePixels(size, fn) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y += 1) {
    for (let x = 0; x < size; x += 1) {
      const i = (y * size + x) * 4;
      const px = fn(x, y, size);
      d[i] = px[0]; d[i + 1] = px[1]; d[i + 2] = px[2]; d[i + 3] = px[3];
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
const dither = () => (rnd() - 0.5) / 255;   // 一个色阶的抖动，专治断层

function makeGlow(hex) {
  const s = 64;
  const [R, G, B] = rgb(hex);
  return spritePixels(s, (x, y) => {
    const dx = (x + 0.5) / s * 2 - 1;
    const dy = (y + 0.5) / s * 2 - 1;
    const t = Math.sqrt(dx * dx + dy * dy);
    if (t >= 1) return [0, 0, 0, 0];
    const a = Math.exp(-4.6 * t * t) * (1 - t);          // 平滑衰减，边缘正好归零
    const w = clamp(1 - t * 2.2, 0, 1);                  // 芯子里偏白
    return [
      Math.round(R + (255 - R) * w),
      Math.round(G + (255 - G) * w),
      Math.round(B + (255 - B) * w),
      Math.round(clamp(a + dither(), 0, 1) * 255),
    ];
  });
}
const SPRITES = ARM_COLORS.map(makeGlow);
const CORE_SPRITE = makeGlow('#c8dcff');

/* 星云贴图：大团的柔光，和星点不一样——它要「没有边」 */
function makeCloud(hex) {
  const s = 160;
  const [R, G, B] = rgb(hex);
  // 三团偏心的小云叠成一大团：只画一个圆会像灯泡，叠出来才有毛边
  const BLOBS = [[0.50, 0.50, 0.46, 1.00], [0.37, 0.43, 0.30, 0.72], [0.62, 0.57, 0.27, 0.60]];
  return spritePixels(s, (x, y) => {
    let acc = 0;
    for (const [bx, by, br, w] of BLOBS) {
      const dx = (x + 0.5) / s - bx;
      const dy = (y + 0.5) / s - by;
      const d = Math.sqrt(dx * dx + dy * dy) / br;
      if (d < 1) acc += w * Math.exp(-2.6 * d * d) * (1 - d);
    }
    acc = Math.min(1, acc * 0.62);
    return [R, G, B, Math.round(clamp(acc + dither(), 0, 1) * 255)];
  });
}
const CLOUDS = ARM_COLORS.map(makeCloud);

/* 整片盘面的底光也烘成一张图：大范围渐变最容易出一圈圈的断层 */
const HAZE_SPRITE = (() => {
  const s = 256;
  return spritePixels(s, (x, y) => {
    const dx = (x + 0.5) / s * 2 - 1;
    const dy = (y + 0.5) / s * 2 - 1;
    const t = Math.min(1.4, Math.sqrt(dx * dx + dy * dy));
    let a = 0.105 * Math.exp(-2.1 * t * t) + 0.052 * Math.exp(-Math.pow((t - 0.46) / 0.30, 2));
    a *= Math.pow(clamp(1 - t, 0, 1), 0.85);
    const m = clamp(t * 1.7, 0, 1);
    return [
      Math.round(122 + (84 - 122) * m),
      Math.round(152 + (76 - 152) * m),
      Math.round(238 + (168 - 238) * m),
      Math.round(clamp(a + dither(), 0, 1) * 255),
    ];
  });
})();

/* 星云团：沿旋臂撒，跟着臂一起差速转——这是「整体光效」里成片的那部分 */
const CLOUD_COUNT = 46;
const nebulae = [];
for (let i = 0; i < CLOUD_COUNT; i += 1) {
  const outer = i < CLOUD_COUNT * 0.62;          // 六成落在外圈：边缘要化成雾
  const ci = Math.floor(rnd() * armTotal);
  const r = outer ? 0.46 + rnd() * 0.58 : 0.18 + rnd() * 0.34;
  nebulae.push({
    ci, r,
    th: (ci / armTotal) * Math.PI * 2 + r * 2.05 + (rnd() - 0.5) * (0.16 + r * 0.26),
    size: (outer ? 0.16 : 0.10) + rnd() * 0.13,
    a: 0.10 + rnd() * 0.11,
    y: gauss() * 0.03,
  });
}

/* ============================================================
   ③ 投影：先绕 Y 转，再俯仰；越远越小（一点点透视就够）
   ============================================================ */
let S = 1, CX = 0, CY = 0;
const cosYaw = () => Math.cos(view.yaw), sinYaw = () => Math.sin(view.yaw);
const cosPitch = () => Math.cos(view.pitch), sinPitch = () => Math.sin(view.pitch);

function project(x, y, z) {
  const cy = cosYaw(), sy = sinYaw(), cp = cosPitch(), sp = sinPitch();
  const X = x * cy - z * sy;
  const Z = x * sy + z * cy;
  const Y = y * cp - Z * sp;
  const Z2 = y * sp + Z * cp;
  const f = 1 / (1 + Z2 * 0.55);
  // 缩放只能在这里生效——之前 view.zoom 改了却没人用，等于没做
  const k = S * view.zoom;
  return { x: CX + X * k * f, y: CY + Y * k * f, f, z: Z2 };
}

/* 差速自转：靠内快、靠外慢 */
const omega = (r) => 0.052 / (0.34 + r);

/* ============================================================
   ④ 画
   ============================================================ */
let bgGrad = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
 CX = W / 2; CY = H * 0.5;
  S = Math.min(W, H) * 0.46;
  bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.72);
  bgGrad.addColorStop(0, '#040a18');
  bgGrad.addColorStop(0.45, '#02060f');
  bgGrad.addColorStop(1, '#01030a');
}
window.addEventListener('resize', resize);

/* 整个盘面的底光：让旋涡的边缘融进雾里，而不是硬边贴在黑底上 */
function drawHaze() {
  const R = S * view.zoom * 1.5;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  ctx.drawImage(HAZE_SPRITE, CX - R, CY - R, R * 2, R * 2);
  ctx.globalCompositeOperation = 'source-over';
}

/* 星云：一层压不住的淡云，让星带「有厚度」，但不遮星点 */
function drawNebulae() {
  ctx.globalCompositeOperation = 'lighter';
  for (const nb of nebulae) {
    const ang = nb.th + clock * omega(nb.r);
    const p = project(Math.cos(ang) * nb.r, nb.y, Math.sin(ang) * nb.r);
    const size = nb.size * S * view.zoom * 1.9 * p.f;
    if (p.x < -size || p.x > W + size || p.y < -size || p.y > H + size) continue;
    const dim = (focusArm != null && nb.ci !== focusArm ? 0.25 : 1) * winDim;
    ctx.globalAlpha = nb.a * dim;
    ctx.drawImage(CLOUDS[nb.ci], p.x - size / 2, p.y - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

const haloBuf = [];
function drawDust() {
  haloBuf.length = 0;
  let curStyle = '';
  for (const d of dust) {
    const ang = d.th + clock * omega(d.r);
    const x = Math.cos(ang) * d.r;
    const z = Math.sin(ang) * d.r;
    const p = project(x, d.y, z);
    if (p.x < -8 || p.x > W + 8 || p.y < -8 || p.y > H + 8) continue;
    const dim = (focusArm != null && d.ci !== focusArm ? 0.22 : 1) * winDim;
    const style = rgba(ARM_COLORS[d.ci], DUST_BUCKET_A[d.bucket] * dim);
    if (style !== curStyle) { ctx.fillStyle = style; curStyle = style; }
    const s = d.size * (0.7 + p.f * 0.5);
    ctx.fillRect(p.x, p.y, s, s);
    // 亮星记下来，第一遍画完统一补光晕（光晕要 additive，混在循环里会反复切合成模式）
    if (d.bucket >= 3) haloBuf.push(p.x, p.y, d.size, d.ci, dim);
  }
  // 第二遍：柔光晕。dust 已按颜色排序，光晕也按序画，换图的次数等于颜色数
  if (haloBuf.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < haloBuf.length; i += 5) {
      const hx = haloBuf[i], hy = haloBuf[i + 1];
      const sz = haloBuf[i + 2] * 10;
      const ci = haloBuf[i + 3], dm = haloBuf[i + 4];
      ctx.globalAlpha = 0.26 * dm;
      ctx.drawImage(SPRITES[ci], hx - sz / 2, hy - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* 中心：自我核心。黑洞不发光，发光的是它周围被卷起来的记忆 */
function drawCore() {
  // 自我核心不该抢戏：黑洞半径取原来的一半，光还是留着
  const R = S * 0.0575 * view.zoom;
  const pulse = 0.92 + Math.sin(clock * 0.9) * 0.05;

  // 整颗核心的柔光（先垫一层 additive，吸积盘才像是「亮在外面」）
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.5;
  const halo = R * 9.5;
  ctx.drawImage(CORE_SPRITE, CX - halo / 2, CY - halo / 2, halo, halo);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 外侧冷光
  const g1 = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 2.6);
  g1.addColorStop(0, 'rgba(130,185,255,.42)');
  g1.addColorStop(0.35, 'rgba(95,150,240,.18)');
  g1.addColorStop(1, 'rgba(60,110,200,0)');
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(CX, CY, R * 2.6, 0, Math.PI * 2); ctx.fill();

  // 吸积盘亮环
  const g2 = ctx.createRadialGradient(CX, CY, R * 0.55, CX, CY, R * 1.25);
  g2.addColorStop(0, 'rgba(180,215,255,0)');
  g2.addColorStop(0.55, `rgba(205,232,255,${0.58 * pulse})`);
  g2.addColorStop(0.78, `rgba(145,195,255,${0.40 * pulse})`);
  g2.addColorStop(1, 'rgba(90,140,235,0)');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(CX, CY, R * 1.25, 0, Math.PI * 2); ctx.fill();

  // 视界
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(CX, CY, R * 0.62, 0, Math.PI * 2); ctx.fill();

  // 细边
  ctx.strokeStyle = `rgba(205,230,255,${0.55 * pulse})`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, R * 0.63, 0, Math.PI * 2); ctx.stroke();

  // 名字
  // 名字放到吸积盘外面，不然会被亮环压住
  const labelY = CY + R * 2.0;
  ctx.fillStyle = 'rgba(175,205,255,.55)';
  ctx.font = '11px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('自我核心', CX, labelY);
  ctx.fillStyle = 'rgba(140,175,235,.30)';
  ctx.fillText('自我核心', CX, labelY + 15);
}

const pts = new Map();   // id -> {x,y,f,z}  本帧屏幕坐标

function drawEdges() {
  const sel = selected != null ? nodeById.get(selected) : null;
  // 平时一根线都不画：海面干净，只剩星；点开一颗才把它和谁相连摊出来
  if (!sel) return;
  ctx.lineWidth = 0.9;
  for (const e of DATA.edges) {
    if (e.a !== sel.id && e.b !== sel.id) continue;
    const a = pts.get(e.a), b = pts.get(e.b);
    if (!a || !b) continue;
    const col = ARM_COLORS[colorIdxOf(nodeById.get(e.a).arm)];
    ctx.strokeStyle = rgba(col, 0.42);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

function drawNodes() {
  // 远的先画
  const list = [...DATA.nodes].sort((p, q) => (pts.get(q.id)?.z ?? 0) - (pts.get(p.id)?.z ?? 0));
  for (const n of list) {
    const p = pts.get(n.id);
    if (!p) continue;
    const ci = colorIdxOf(n.arm);
    // 时间窗内的星才亮；窗外的不是删掉，是暗成一颗底子（still there，只是今晚不看它）
    const inWin = inWindow(n.startTs) ? 1 : 0.06;
    const dim = (focusArm != null && ci !== focusArm ? 0.16 : 1) * inWin;
    const bright = n.bright * dim * (0.55 + 0.45 * p.f);
    const zk = clamp(0.78 + 0.22 * view.zoom, 0.8, 1.7);
    const size = (11 + 21 * n.size) * p.f * zk;

    ctx.globalCompositeOperation = 'lighter';
    // 外圈大光晕：暗底上星星是「亮着」的，不是贴了个点
    const wide = size * 3.6;
    ctx.globalAlpha = clamp(bright * 0.34, 0.02, 0.62);
    ctx.drawImage(SPRITES[ci], p.x - wide / 2, p.y - wide / 2, wide, wide);
    ctx.globalAlpha = clamp(bright, 0.06, 1);
    ctx.drawImage(SPRITES[ci], p.x - size / 2, p.y - size / 2, size, size);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 实心小核
    ctx.fillStyle = `rgba(255,255,255,${clamp(0.35 + bright * 0.65, 0, 1)})`;
    const d = Math.max(1.1, 2.2 * p.f * zk);
    ctx.fillRect(p.x - d / 2, p.y - d / 2, d, d);

    // 档案星：那一段的原话已经读不到了（会话日志被裁过），只剩摘要。
    // 画一圈虚线，别让它们冒充还能点开原文的星。
    if (n.archived) {
      ctx.strokeStyle = `rgba(190,215,255,${clamp(0.16 + bright * 0.24, 0, 0.46)})`;
      ctx.lineWidth = 0.7;
      ctx.setLineDash([1.6, 2.2]);
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2.6, size * 0.44), 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (n.id === selected) {
      ctx.strokeStyle = 'rgba(235,245,255,.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.55, 0, Math.PI * 2); ctx.stroke();
    } else if (n.id === hover) {
      ctx.strokeStyle = 'rgba(200,225,255,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

function drawHoverLabel() {
  const id = hover ?? selected;
  if (id == null) return;
  const n = nodeById.get(id);
  const p = pts.get(id);
  if (!n || !p) return;
  const text = n.head.length > 26 ? n.head.slice(0, 26) + '…' : n.head;
  ctx.font = '12px "Segoe UI","Microsoft YaHei",sans-serif';
  const w = ctx.measureText(text).width + 18;
  const x = clamp(p.x - w / 2, 8, W - w - 8);
  const y = p.y - 26;
  ctx.fillStyle = 'rgba(6,11,22,.86)';
  ctx.strokeStyle = 'rgba(140,180,255,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, 22, 6); else ctx.rect(x, y, w, 22);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(226,238,255,.92)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w / 2, y + 12);
}

function frame(now) {
  if (!view.paused) clock += Math.min(0.05, (now - t0) / 1000);
  t0 = now;

  // 星尘没有日期，时间窗只把它整体压暗一点，让人一眼看出「在只看一段」；
  // 有日期的星星才是真的亮/暗（drawNodes 里按 inWindow 判）
  winDim = windowOn() ? 0.5 : 1;

  ctx.fillStyle = bgGrad || '#01030a';
  ctx.fillRect(0, 0, W, H);

  drawHaze();       // 先垫整片盘面的底光
  drawNebulae();    // 再把成片的云撒进臂里
  drawDust();

  pts.clear();
  for (const n of DATA.nodes) {
    const ang = n.a0 + clock * omega(n.r);
    const x = Math.cos(ang) * n.r;
    const z = Math.sin(ang) * n.r;
    pts.set(n.id, project(x, n.y0, z));
  }

  drawEdges();
  drawCore();
  drawNodes();
  drawHoverLabel();

  requestAnimationFrame(frame);
}

/* ============================================================
   ⑤ 交互
   ============================================================ */
let dragging = false, moved = 0, lastX = 0, lastY = 0;

cv.addEventListener('pointerdown', (e) => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('dragging');
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    view.yaw += dx * 0.006;
    view.pitch = clamp(view.pitch + dy * 0.004, -0.9, 1.45);
  } else {
    hover = pick(e.clientX, e.clientY);
    cv.style.cursor = hover != null ? 'pointer' : 'grab';
    const tip = document.getElementById('tip');
    if (hover != null) {
      const n = nodeById.get(hover);
      tip.textContent = n.head;
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 300) + 'px';
      tip.style.top = (e.clientY + 16) + 'px';
      tip.style.opacity = '1';
    } else {
      tip.style.opacity = '0';
    }
  }
});
cv.addEventListener('pointerup', (e) => {
  dragging = false;
  cv.classList.remove('dragging');
  if (moved < 6) {
    const id = pick(e.clientX, e.clientY);
    if (id != null) select(id); else closePanel();
  }
});
cv.addEventListener('pointercancel', () => { dragging = false; cv.classList.remove('dragging'); });

cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.0012), 0.55, 3.2);
}, { passive: false });

cv.addEventListener('dblclick', () => { view.yaw = HOME.yaw; view.pitch = HOME.pitch; view.zoom = HOME.zoom; });

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); view.paused = !view.paused; }
  if (e.key === 'Escape') closePanel();
});

function pick(mx, my) {
  let best = null, bestD = 17;
  for (const [id, p] of pts) {
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}

/* ============================================================
   ⑥ 点开一颗星
   ============================================================ */
const panel = document.getElementById('panel');

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function select(id) {
  const n = nodeById.get(id);
  if (!n) return;
  selected = id;
  panel.classList.add('open');

  document.getElementById('p-arm').textContent = (n.arm || '其它').toUpperCase();
  document.getElementById('p-head').textContent = n.head;
  document.getElementById('p-meta').innerHTML =
    `<span>${fmtTime(n.startTs)}</span>` +
    `<span>重量 ${n.weight ?? '—'}${n.refined ? ' · 手写' : ''}${n.archived ? ' · 档案（原话已不在）' : ''}</span>`;

  const kw = document.getElementById('p-kw');
  kw.innerHTML = (n.kw || []).slice(0, 8).map((k) => `<span>${escapeHtml(k)}</span>`).join('');

  document.getElementById('p-ptr').textContent = `${n.sid}\nseq ${n.from} – ${n.to}`;

  const rel = document.getElementById('p-rel');
  rel.innerHTML = '';
  const near = [];
  for (const e of DATA.edges) {
    if (e.a === id) near.push({ id: e.b, via: e.via });
    else if (e.b === id) near.push({ id: e.a, via: e.via });
  }
  if (!near.length) {
    rel.innerHTML = '<div style="font-size:11.5px;color:#5f7393">这一段还没有连上别的记忆。</div>';
  }
  for (const x of near.slice(0, 24)) {
    const o = nodeById.get(x.id);
    if (!o) continue;
    const b = document.createElement('button');
    b.innerHTML = `<span class="t">${fmtTime(o.startTs).slice(5, 16)}</span>${escapeHtml(clip(o.head, 38))}<span class="v">· ${escapeHtml(x.via)}</span>`;
    b.onclick = () => select(o.id);
    rel.appendChild(b);
  }
}
const clip = (s, n) => (s && s.length > n ? s.slice(0, n) + '…' : (s || ''));
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function closePanel() {
  panel.classList.remove('open');
  selected = null;
}
document.getElementById('close').onclick = closePanel;

/* ============================================================
   ⑦ 图例与统计
   ============================================================ */
(function buildLegend() {
  const counts = new Map();
  for (const n of DATA.nodes) {
    const a = n.arm || '其它';
    counts.set(a, (counts.get(a) || 0) + 1);
  }
  const box = document.getElementById('legend');
  const order = [...counts.entries()].sort((p, q) => q[1] - p[1]);
  for (const [name, c] of order) {
    const row = document.createElement('div');
    row.className = 'row';
    const ci = colorIdxOf(name);
    row.innerHTML = `<span class="dot" style="background:${ARM_COLORS[ci]};box-shadow:0 0 8px ${ARM_COLORS[ci]}"></span>` +
      `<span>${escapeHtml(name)}</span><span class="n">${c}</span>`;
    row.onclick = () => {
      focusArm = focusArm === ci ? null : ci;
      [...box.children].forEach((el) => el.classList.toggle('on', el === row && focusArm != null));
    };
    box.appendChild(row);
  }
  const s = DATA.stats || {};
  document.getElementById('stat').innerHTML =
    `<b>${DATA.nodes.length}</b> 段记忆 · <b>${DATA.edges.length}</b> 条连线 · <b>${order.length}</b> 条旋臂`;
})();

/* ============================================================
   ⑧ 时间窗：拖两下滑块，只亮那段日子的星
   ——星尘没有日期，只整体压暗；有日期的星星才真的亮/暗。
      别把窗外的星删掉：删掉就成了「这段日子不存在」，暗着才是「今晚不看它」。
   ============================================================ */
(function buildTimeFilter() {
  const a = document.getElementById('tfA');
  const b = document.getElementById('tfB');
  const out = document.getElementById('tfOut');
  const all = document.getElementById('tfAll');
  if (!a || !b || !out) return;

  for (const el of [a, b]) { el.min = DAY_MIN; el.max = DAY_MAX; el.step = 1; }
  a.value = win.from;
  b.value = win.to;

  // 天数是以 UTC 零点切的，显示时补成东八区的日历日
  const fmt = (d) => new Date(d * DAY_MS + 8 * 3600e3).toISOString().slice(0, 10);

  function paint() {
    const on = windowOn();
    out.textContent = on ? `${fmt(win.from)} → ${fmt(win.to)}` : '全部';
    out.style.color = on ? '#cfdcff' : '';
    all.style.display = on ? '' : 'none';
  }

  function sync(which) {
    let f = Number(a.value), t = Number(b.value);
    if (which === 'from' && f > t) t = f;
    if (which === 'to' && t < f) f = t;
    win.from = f; win.to = t;
    a.value = f; b.value = t;
    paint();
  }

  a.oninput = () => sync('from');
  b.oninput = () => sync('to');
  all.onclick = () => {
    win.from = DAY_MIN; win.to = DAY_MAX;
    a.value = win.from; b.value = win.to;
    paint();
  };
  paint();
})();

/* 开场：慢慢自转到正视角 */
view.yaw = -0.35;
resize();
requestAnimationFrame((now) => { t0 = now; frame(now); });
</script>
</body>
</html>
